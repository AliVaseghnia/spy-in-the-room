<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10161e">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="offline.css">
    <title>Spy in the Room — You’re offline</title>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <div class="brand-mark" aria-hidden="true">S</div>
      <p class="eyebrow">The connection dropped</p>
      <h1 id="offline-title">You’re offline.</h1>
      <p class="lede">Your saved game lives on the game server. Reconnect before you keep playing.</p>
      <p id="connection-status" class="status" role="status" aria-live="polite">Checking your connection…</p>
      <button id="retry-button" type="button">Try again</button>
      <p class="note">This page doesn’t store player names, roles, locations, cards, or session data.</p>
    </main>

    <script src="offline.js"></script>
  </body>
</html>
